name: Database migrations

# Applied automatically on a merge to main, but never blind. There is no staging branch to
# rehearse against, so the other three properties carry the whole risk:
#
#   1. A failure stops the job before anything else runs, so a half-applied schema never gets
#      a matching app shipped on top of it.
#   2. Migrations are forward-only and additive. Add a column, backfill, and drop it in a
#      LATER migration, never the same one, so a rollback of the app does not require a
#      rollback of the schema.
#   3. concurrency will not cancel a run in progress, so two merges cannot both apply.
#
# With no staging branch, main is the first place a migration ever runs. Read what is pending
# before merging: supabase migration list --db-url "$SUPABASE_DB_URL" changes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show what would be applied
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Confirm the schema is reachable afterwards
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
