name: Database migrations

# Applied automatically, but never blind. Four properties make that survivable:
#
#   1. staging runs first. A merge to main only ever applies what staging already accepted,
#      so main is the second time a migration runs, not the first.
#   2. A failure stops the job, and the deploy gate below depends on it — so a half-applied
#      schema never gets a matching app shipped on top of it.
#   3. Migrations are forward-only and additive. Add a column, backfill, and drop it in a
#      LATER migration, never the same one, so a rollback of the app does not require a
#      rollback of the schema.
#   4. concurrency cancels an overlapping run, so two deploys cannot both apply.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show what would be applied
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Confirm the schema is reachable afterwards
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
