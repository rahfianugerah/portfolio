name: Database migrations

# Applied automatically on a merge to backend-main, but never blind. There is no staging branch to
# rehearse against, so the other three properties carry the whole risk:
#
#   1. A failure stops this job and marks the commit red. It does NOT stop Vercel: the
#      deployment starts from the same push and runs beside this job, so for a minute the new
#      code can meet the old schema, or the old code the new one.
#   2. Migrations are forward-only and additive, which is what makes point 1 survivable. Add a
#      column, backfill, and drop it in a LATER migration, never the same one, so code of
#      either age works against either schema, and a rollback of the app never needs a
#      rollback of the schema.
#   3. concurrency will not cancel a run in progress, so two merges cannot both apply.
#
# With no staging branch, backend-main is the first place a migration ever runs. Read what is pending
# before merging: supabase migration list --db-url "$SUPABASE_DB_URL" changes nothing.

on:
  push:
    branches: [backend-main]
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show what would be applied
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Confirm the schema is reachable afterwards
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
